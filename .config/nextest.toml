[profile.default]
fail-fast = false
# SLOW is only a warning at 60 seconds. Jenkins captures diagnostics at 300
# seconds, and nextest terminates the test as TIMEOUT at 360 seconds.
slow-timeout = { period = "60s", terminate-after = 6, grace-period = "30s" }
test-threads = "num-cpus"
failure-output = "immediate-final"
success-output = "never"
status-level = "slow"
final-status-level = "slow"

[profile.ci]

[profile.ci.junit]
path = "junit.xml"
store-success-output = false
store-failure-output = true
